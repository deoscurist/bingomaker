name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: ubuntu-latest
            script: build-win.sh
            arch: x64
            artifact: artifacts/BingoMaker-*-windows-x64.exe

          - target: windows-arm64
            runner: ubuntu-latest
            script: build-win.sh
            arch: arm64
            artifact: artifacts/BingoMaker-*-windows-arm64.exe

          - target: macos-x64
            runner: macos-15-intel
            script: build-mac.sh
            arch: x64
            artifact: artifacts/BingoMaker-*-macos-x64.dmg

          - target: macos-arm64
            runner: macos-15
            script: build-mac.sh
            arch: arm64
            artifact: artifacts/BingoMaker-*-macos-arm64.dmg

          - target: linux-x64
            runner: ubuntu-24.04
            script: build-linux.sh
            arch: x64
            appimagetool: x86_64
            artifact: artifacts/BingoMaker-*-linux-x86_64.AppImage

          - target: linux-arm64
            runner: ubuntu-24.04-arm
            script: build-linux.sh
            arch: arm64
            appimagetool: aarch64
            artifact: artifacts/BingoMaker-*-linux-aarch64.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup appimagetool
        if: matrix.appimagetool != ''
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils

          mkdir -p "$RUNNER_TEMP/bin"

          curl -fsSL \
            -o "$RUNNER_TEMP/bin/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimagetool }}.AppImage"

          chmod +x "$RUNNER_TEMP/bin/appimagetool"

          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build ${{ matrix.target }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash "build/${{ matrix.script }}" "${{ matrix.arch }}" "$VERSION"

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: BingoMaker-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'failure') }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: BingoMaker-*
          path: artifacts
          merge-multiple: true

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          FILES=(artifacts/*)

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No release artifacts were produced." >&2
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" \
            "${FILES[@]}" \
            --draft \
            --verify-tag \
            --title "BingoMaker $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.m